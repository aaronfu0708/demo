<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全方位健康養生 - T&E Global 盛德信環球集團</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            overflow-x: hidden;
            background-color: #ffffff;
        }

        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 0;
            z-index: 1000;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(15, 15, 35, 0.2);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar.scrolled {
            background: rgba(0, 93, 145, 0.9);
        }

        .nav-container {
            max-width: 1700px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo-img {
            height: 60px;
            width: auto;
            object-fit: contain;
            filter: brightness(1.2);
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 40px;
            align-items: center;
        }

        .nav-menu li {
            list-style: none;
        }

        .nav-menu a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            font-size: 1.1rem;
            position: relative;
            transition: all 0.3s ease;
            padding: 10px 0;
        }

        .nav-menu a::before {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 0;
            background: linear-gradient(90deg, #00d4ff, #4ade80);
            transition: width 0.3s ease;
        }

        .nav-menu a:hover::before {
            width: 100%;
        }

        .nav-menu a:hover {
            color: #00d4ff;
            transform: translateY(-2px);
        }

        /* 語言選擇器 */
        .language-selector {
            position: relative;
            display: inline-block;
        }

        .language-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .language-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .language-btn::after {
            content: '▼';
            font-size: 0.6rem;
        }

        .language-btn.active::after {
            transform: rotate(180deg);
        }

        .language-dropdown {
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-10px);
            background: rgba(20, 20, 20, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            min-width: 130px;
            opacity: 0;
            text-align: center;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .language-dropdown.active {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .language-dropdown a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .language-dropdown a:hover {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
        }

        .language-dropdown a.active {
            color: #00d4ff;
        }

        /* 漢堡選單 */
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            padding: 8px;
            z-index: 1001;
            background: none;
            border: none;
            transition: all 0.3s ease;
        }

        .hamburger-line {
            height: 2px;
            background: white;
            margin: 3px 0;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .hamburger-line-long {
            width: 25px;
        }

        .hamburger-line-short {
            width: 18px;
            margin-left: auto;
        }

        .hamburger.active .hamburger-line-long {
            transform: rotate(45deg) translate(6px, 6px);
        }

        .hamburger.active .hamburger-line-short {
            transform: rotate(-45deg);
        }

        /* 產品展示區域 */
        .product-hero {
            min-height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 20px 80px;
            background: linear-gradient(135deg, #0a1929 0%, #1a365d 50%, #0f2027 100%);
            overflow: hidden;
        }

        .product-hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('img/leaf.jpg') center/cover no-repeat;
            z-index: 1;
        }

        /* 深色遮罩層，增強對比 */
        .product-hero::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 2;
        }

        .product-content {
            position: relative;
            z-index: 3;
            max-width: 1400px;
            width: 100%;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(40px);
            }
            to {
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .product-header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeIn 1s ease-out 0.2s both;
        }

        .product-header h1 {
            font-size: 3.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #ffffff 0%, #a0e7ff 50%, #4ade80 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .product-header .subtitle {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 300;
            letter-spacing: 3px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .product-card {
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            cursor: pointer;
            text-decoration: none;
            display: block;
            animation: fadeInCard 0.6s ease-out both;
        }

        .product-card:nth-child(1) {
            animation-delay: 0.3s;
        }

        .product-card:nth-child(2) {
            animation-delay: 0.4s;
        }

        .product-card:nth-child(3) {
            animation-delay: 0.5s;
        }

        .product-card:nth-child(4) {
            animation-delay: 0.6s;
        }

        @keyframes fadeInCard {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .product-card-icon,
        .product-card-title,
        .product-card-description {
            animation: fadeIn 0.6s ease-out both;
        }

        .product-card:nth-child(1) .product-card-icon,
        .product-card:nth-child(1) .product-card-title,
        .product-card:nth-child(1) .product-card-description {
            animation-delay: 0.3s;
        }

        .product-card:nth-child(2) .product-card-icon,
        .product-card:nth-child(2) .product-card-title,
        .product-card:nth-child(2) .product-card-description {
            animation-delay: 0.4s;
        }

        .product-card:nth-child(3) .product-card-icon,
        .product-card:nth-child(3) .product-card-title,
        .product-card:nth-child(3) .product-card-description {
            animation-delay: 0.5s;
        }

        .product-card:nth-child(4) .product-card-icon,
        .product-card:nth-child(4) .product-card-title,
        .product-card:nth-child(4) .product-card-description {
            animation-delay: 0.6s;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, rgba(74, 222, 128, 0.1) 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: 1;
        }

        .product-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(0, 212, 255, 0.5);
            box-shadow: 0 20px 60px rgba(0, 212, 255, 0.2);
        }

        .product-card:hover::before {
            opacity: 1;
        }

        .product-card-icon {
            position: relative;
            z-index: 2;
            width: 140px;
            height: 140px;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
        }

        .product-card:hover .product-card-icon {
            transform: scale(1.1) rotate(5deg);
           
        }

        .product-card-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 15px rgba(0, 0, 0, 0.3));
            transition: all 0.4s ease;
        }

        .product-card:hover .product-card-icon img {
            transform: scale(1.15);
            filter: drop-shadow(0 8px 25px rgba(0, 212, 255, 0.4));
        }

        .product-card-title {
            position: relative;
            z-index: 2;
            font-size: 1.5rem;
            font-weight: 600;
            color: white;
            text-align: center;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .product-card-description {
            position: relative;
            z-index: 2;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            line-height: 1.6;
        }

        .view-all-products {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 50px;
            position: relative;
            z-index: 3;
            animation: fadeIn 0.6s ease-out 0.25s both;
        }

        .view-all-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 18px 50px;
            border-radius: 50px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(74, 222, 128, 0.2));
            border: 2px solid rgba(0, 212, 255, 0.4);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .view-all-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }

        .view-all-btn:hover::before {
            left: 100%;
        }

        .view-all-btn:hover {
            transform: translateY(-5px) scale(1.05);
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.3), rgba(74, 222, 128, 0.3));
            border-color: rgba(0, 212, 255, 0.7);
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.4);
        }

        .view-all-btn .title {
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            margin-right: 12px;
            letter-spacing: 2px;
            position: relative;
            z-index: 1;
        }

        .view-all-btn .arrow {
            margin-left: 8px;
            font-size: 1.3rem;
            color: white;
            transition: transform 0.4s ease;
            position: relative;
            z-index: 1;
        }

        .view-all-btn:hover .arrow {
            transform: translateX(8px);
        }

        .product-footer {
            text-align: center;
            margin-top: 60px;
            position: relative;
            z-index: 3;
        }

        .product-footer-text {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 1.5px;
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }

            .nav-container {
                padding: 0 20px;
            }

            /* 手機版導航菜單 */
            .nav-menu {
                position: fixed;
                top: 0;
                right: -100%;
                width: 100%;
                height: 100vh;
                background: url('img/leaf.jpg') center/cover no-repeat;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 1000;
            }

            .nav-menu.active {
                right: 0;
            }

            .nav-menu a {
                color: white;
                text-decoration: none;
                font-size: 1.5rem;
                font-weight: 600;
                transition: all 0.3s ease;
                position: relative;
                display: block;
                padding: 15px 40px;
                border-radius: 60px;
                background: rgba(255, 255, 255, 0.05);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }

            .nav-menu a:hover {
                color: #535353;
                transform: translateY(-5px) scale(1.05);
                background: rgb(241, 253, 255);
            }

            .nav-menu a::before {
                display: none;
            }

            .logo-img {
                height: 40px;
            }

            .product-hero {
                padding: 100px 15px 60px;
                min-height: auto;
            }

            .product-header {
                margin-top: 30px;
                margin-bottom: 40px;
            }

            .product-header h1 {
                font-size: 2rem;
                margin-bottom: 15px;
                letter-spacing: 1px;
            }

            .product-header .subtitle {
                font-size: 1rem;
                letter-spacing: 2px;
            }

            .product-grid {
                grid-template-columns: 1fr 1fr;
                gap: 20px;
            }

            .product-card {
                padding: 15px 10px;
            }

            .product-card-icon {
                width: 100px;
                height: 100px;
                margin: 0 auto 5px;
            }

            .product-card-title {
                font-size: 1.2rem;
                margin-bottom: 12px;
            }

            .product-card-description {
                font-size: 0.85rem;
            }

            .view-all-products {
                margin-top: 40px;
                margin-bottom: 30px;
            }

            .view-all-btn {
                padding: 16px 40px;
            }

            .view-all-btn .title {
                font-size: 1.1rem;
                margin-right: 10px;
                letter-spacing: 1.5px;
            }

            .view-all-btn .arrow {
                font-size: 1.1rem;
                margin-left: 6px;
            }

            .product-footer {
                margin-top: 40px;
            }

            .product-footer-text {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- 導航欄 -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="img/toplogo.png" alt="T&E GLOBAL" class="logo-img" translate="no">
            </a>

            <ul class="nav-menu">
                <li><a href="product.html">全方位健康養生</a></li>
                <li><a href="service.html">服務據點</a></li>
                <li><a href="company.html">關於我們</a></li>
                <li><a href="science.html">研發團隊</a></li>
                <li><a href="https://m.trustethic.com">會員專區</a></li>
            </ul>

            <div class="language-selector">
                <button class="language-btn" id="languageBtn">
                    繁體中文
                </button>
                <div class="language-dropdown" id="languageDropdown">
                    <a href="#" class="active">繁體中文</a>
                    <a href="#">English</a>
                    <a href="#">简体中文</a>
                    <a href="#">Tiếng Việt</a>
                </div>
            </div>

            <div class="hamburger" id="hamburger">
                <span class="hamburger-line hamburger-line-long"></span>
                <span class="hamburger-line hamburger-line-short"></span>
            </div>
        </div>
    </nav>

    <!-- 產品展示區域 -->
    <section class="product-hero">
        <div class="product-content">
            <div class="product-header">
                <h1>全方位健康養生</h1>
                <p class="subtitle">內療 · 外療 · 氛圍營造</p>
            </div>

            <div class="view-all-products">
                <a href="#" class="view-all-btn">
                    <span class="title">查看所有商品</span>
                    <span class="arrow">→</span>
                </a>
            </div>

            <div class="product-grid">
                <a href="#" class="product-card">
                    <div class="product-card-icon">
                        <img src="img/ss1.png" alt="概念">
                    </div>
                    <h3 class="product-card-title">概念</h3>
                    <p class="product-card-description">健康養生核心理念</p>
                </a>

                <a href="#" class="product-card">
                    <div class="product-card-icon">
                        <img src="img/submenu_C-all.png" alt="清潔">
                    </div>
                    <h3 class="product-card-title">清潔</h3>
                    <p class="product-card-description">呵護您的健康</p>
                </a>

                <a href="#" class="product-card">
                    <div class="product-card-icon">
                        <img src="img/submenu.png" alt="補給">
                    </div>
                    <h3 class="product-card-title">補給</h3>
                    <p class="product-card-description">優質營養補充</p>
                </a>

                <a href="#" class="product-card">
                    <div class="product-card-icon">
                        <img src="img/nursing.png" alt="調節">
                    </div>
                    <h3 class="product-card-title">調節</h3>
                    <p class="product-card-description">平衡身心靈</p>
                </a>
            </div>

            <div class="product-footer">
                <p class="product-footer-text">盛德信股份有限公司©2025 ALL Right Reserved</p>
            </div>
        </div>
    </section>

    <script>
        // 導航欄滾動效果
        window.addEventListener('scroll', () => {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // 漢堡選單功能
        const hamburger = document.getElementById('hamburger');
        const navMenu = document.querySelector('.nav-menu');

        function toggleMobileNav() {
            hamburger.classList.toggle('active');
            navMenu.classList.toggle('active');
            
            if (navMenu.classList.contains('active')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = 'auto';
            }
        }

        hamburger.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleMobileNav();
        });

        // 點擊選單項目時關閉選單
        document.querySelectorAll('.nav-menu a').forEach(link => {
            link.addEventListener('click', function() {
                if (navMenu.classList.contains('active')) {
                    toggleMobileNav();
                }
            });
        });

        // 點擊選單外部區域時關閉選單
        navMenu.addEventListener('click', function(e) {
            if (e.target === navMenu && navMenu.classList.contains('active')) {
                toggleMobileNav();
            }
        });

        // 語系選擇器功能
        const languageBtn = document.getElementById('languageBtn');
        const languageDropdown = document.getElementById('languageDropdown');

        function toggleLanguageDropdown() {
            languageDropdown.classList.toggle('active');
            languageBtn.classList.toggle('active');
        }

        function closeLanguageDropdown() {
            languageDropdown.classList.remove('active');
            languageBtn.classList.remove('active');
        }

        languageBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleLanguageDropdown();
        });

        // 點擊選單項目時更新按鈕文字並關閉選單
        document.querySelectorAll('.language-dropdown a').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const selectedLanguage = this.textContent;
                languageBtn.textContent = selectedLanguage;
                
                // 更新active狀態
                document.querySelectorAll('.language-dropdown a').forEach(a => a.classList.remove('active'));
                this.classList.add('active');
                
                closeLanguageDropdown();
            });
        });

        // 點擊外部區域時關閉下拉選單
        document.addEventListener('click', function(e) {
            if (!languageBtn.contains(e.target) && !languageDropdown.contains(e.target)) {
                closeLanguageDropdown();
            }
        });
    </script>
</body>
</html>
