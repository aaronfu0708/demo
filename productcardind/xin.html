<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', 'Helvetica Neue', Arial, sans-serif;
            background: #0a0e1a;
            overflow-x: hidden;
        }

        .images-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .image-item {
            width: 100%;
            max-width: 100%;
            display: block;
        }

        .image-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Gaya Tombol Kembali */
        .back-button {
            position: fixed;
            top: 30px;
            left: 30px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: rgb(68, 68, 68);
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-5px);
            border-color: rgba(212, 175, 55, 0.5);
        }

        .back-button::before {
            content: '←';
            font-size: 1.2rem;
        }

        @media (max-width: 768px) {
            .back-button {
                top: 20px;
                left: 20px;
                padding: 10px 20px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <!-- Tombol Kembali -->
    <a href="../productind.html" class="back-button">Kembali ke Daftar Produk</a>

    <!-- Kontainer Gambar -->
    <div class="images-container">
        <div class="image-item">
            <img src="img/603.jpg" alt="Gambar Produk 1">
        </div>
        <!-- <div class="image-item">
            <img src="img/606_2.jpg" alt="Gambar Produk 2">
        </div>
        <div class="image-item">
            <img src="img/606_3.jpg" alt="Gambar Produk 3">
        </div>
        <div class="image-item">
            <img src="img/606_4.jpg" alt="Gambar Produk 4">
        </div> -->
    </div>
</body>
</html>
